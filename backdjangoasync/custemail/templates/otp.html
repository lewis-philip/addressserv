<!doctype html>
<html lang="en-US">
  <head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <meta name="User Identification E-mail" content="Verification Code">
    <title>User Identification E-mail</title>
  </head>
  <body>
    <div style="display: flex; flex-direction: row; align-items: center; justify-content: center; height: 100vh; background-image: linear-gradient(to bottom, #011a3a, #bce7fc);">
      <div style="display: flex; flex-direction: column; width: max-content; background-color: rgb(255, 255, 255, 0.1); padding: 20px;">
        <h1 style="font-family: Helvetica, Arial, sans-serif; color: #ffffff; font-weight: 400; margin: 0px; font-size: 25px; padding: 30px 0px;">
          Two-factor authentication (2FA)
        </h1>
        <hr style="width: stretch; margin: 20px 0px;">
        <p style="font-family: Helvetica, Arial, sans-serif; color: #ffffff; font-weight: 400; margin: 0px; font-size: 16px; padding: 0px 20px;">
          Please use the following verification code:
        </p>
        <p style="font-family: Helvetica, Arial, sans-serif; color: #ffffff; font-weight: 400; margin: 0px; font-size: 40px; padding: 50px 0px; align-self: center;">
          {{otp}}
        </p>
        <hr style="width: stretch; margin: 20px 0px;">
        <p style="font-family: Helvetica, Arial, sans-serif; color: #ffffff; font-weight: 400; margin: 0px; font-size: 12px;">
          E-mail from {{appname}} Media
        </p>
      </div>
    </div>
  </body>
</html>
